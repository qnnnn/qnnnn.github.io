<!DOCTYPE html>
<!-- -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0d1117;
    color: #fff;
    font-family: "Courier New", monospace;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .wrap {
    width: 100%;
    height: 100%;
    position: relative;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(40,160,60,0.25) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 20%, rgba(180,40,40,0.2) 0%, transparent 50%),
      linear-gradient(135deg, transparent 30%, rgba(100,180,100,0.04) 30%, rgba(100,180,100,0.04) 31%, transparent 31%),
      linear-gradient(45deg, transparent 70%, rgba(100,160,100,0.03) 70%, rgba(100,160,100,0.03) 71%, transparent 71%);
  }
  #game {
    display: inline-flex;
    gap: 16px;
    padding: 16px;
    background: rgba(17,17,17,0.88);
    border: 4px solid #444;
    border-radius: 4px;
    align-items: flex-start;
  }
  #screen {
    image-rendering: pixelated;
    background: #000;
    border: 2px solid #333;
    width: 416px;
    height: 512px;
  }
  #panel {
    width: 130px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 12px;
    flex-shrink: 0;
  }
  .title {
    color: #ffd24d;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 2px 2px #a86b00;
  }
  .box {
    border: 2px solid #555;
    padding: 8px;
    background: #1a1a1a;
  }
  .box h3 { color: #6cff6c; font-size: 13px; margin-bottom: 6px; }
  .row { display: flex; justify-content: space-between; }
  .val { color: #ffd24d; }
  .mute-icon {
    cursor: pointer;
    text-align: center;
    padding: 4px;
    font-size: 13px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 3px;
  }
  .mute-icon:hover { background: #252525; }
  .buff-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 2px 0;
  }
  .buff-ind {
    font-size: 11px;
    color: #ffd24d;
    background: #222;
    padding: 1px 4px;
    border-radius: 2px;
  }
  .panel-section {
    font-size: 10px; color: #6cff6c;
    border-top: 1px solid #333;
    margin-top: 4px; padding-top: 3px;
  }
  .weapon-row {
    display: flex; justify-content: space-between;
    font-size: 10px; padding: 1px 0;
  }
  .wpn-val { color: #999; }
  .wpn-val.active { color: #ffd24d; }
  .panel-hint {
    font-size: 10px;
    color: #555;
    text-align: center;
    padding: 2px 0;
  }
  .keys { font-size: 12px; line-height: 1.8; color: #9ad; }
  .key { color: #fff; background: #333; padding: 1px 5px; border-radius: 2px; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    background: rgba(0,0,0,0.82);
    z-index: 20;
    text-align: center;
  }
  #overlay h1 { color: #ffd24d; font-size: 40px; text-shadow: 3px 3px #a86b00; }
  #overlay p { color: #ccc; font-size: 15px; line-height: 1.9; }
  .btn {
    margin-top: 8px;
    padding: 10px 28px;
    font-family: inherit;
    font-size: 16px;
    color: #000;
    background: #ffd24d;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 2px;
  }
  .btn:hover { background: #ffe27a; }
  .hidden { display: none !important; }
  .wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

  /* 触屏控件 */
  #touch-controls {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 155px;
    z-index: 10;
    justify-content: space-around;
    align-items: center;
    padding: 0 24px;
    background: rgba(0,0,0,0.55);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .is-touch .wrap { display: flex; flex-direction: column; height: 100dvh; }
  .is-touch #game { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; padding: 0; padding-top: 36px; margin: 0; border: none; border-radius: 0; background: #000; overflow: visible; gap: 0; }
  .is-touch #screen { border: none; }
  .is-touch #touch-controls {
    display: flex; flex-shrink: 0; height: 145px;
    justify-content: flex-end; align-items: flex-end;
    padding: 0 20px 14px;
    background: transparent; z-index: 10;
    pointer-events: none;
  }
  .is-touch #touch-controls > * { pointer-events: auto; }
  .is-touch #panel {
    position: fixed; top: 0; left: 0; right: 0;
    width: 100%; flex-direction: row; flex-wrap: wrap;
    gap: 4px; padding: 4px 85px 4px 8px;
    background: rgba(0,0,0,0.7); z-index: 15;
    font-size: 11px; align-items: center; justify-content: center;
  }
  .is-touch #panel .title { display: none; }
  .is-touch #panel .box { border: none; padding: 2px 4px; background: none; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .is-touch #panel .row { gap: 4px; }
  .is-touch #panel .buff-row { display: none; }
  .buff-row { display: none; }
  .is-touch #panel .panel-hint { display: none; }
  .is-touch #panel .mute-icon { position: absolute; right: 8px; top: 4px; }
  .is-touch #btn2p, .is-touch #btnEndless { display: none; }
  .is-touch #overlay p br:first-child { display: none; }
  .is-touch #overlay p .pc-only { display: none; }
  .touch-hint {
    display: none;
    font-size: 11px; color: rgba(255,255,255,0.35);
    text-align: center;
    padding: 4px 0 6px;
    pointer-events: none;
  }
  .is-touch .touch-hint { display: block; }
  /* Keep base joystick styles for desktop fallback */
  .joystick { position: relative; width: 150px; height: 150px; flex-shrink: 0; }
  .joystick-ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 130px; height: 130px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; box-sizing: border-box; }
  .joystick-thumb { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.25); transition: background 0.1s; }
  .joystick.active .joystick-thumb { background: rgba(255,255,255,0.45); }
  .fire-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 8px; }
  .fire-btn {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: rgba(255,60,60,0.25);
    border: 3px solid rgba(255,60,60,0.45);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: rgba(255,255,255,0.7);
    touch-action: none;
  }
  .fire-btn.active { background: rgba(255,60,60,0.5); border-color: rgba(255,60,60,0.8); }
  .tc-pause {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: rgba(255,255,255,0.6);
    touch-action: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="game">
    <canvas id="screen" width="416" height="512"></canvas>
    <div id="panel">
      <div class="title" style="font-size:16px;">坦克大战</div>
      <div class="box">
        <div class="row"><span>得分</span><span class="val" id="score">0</span></div>
        <div class="row"><span id="levelLabel">关卡</span><span class="val"><span id="level">1</span> · ❤<span id="lives">3</span></span></div>
        <div class="row"><span>敌军</span><span class="val" id="enemies">0</span></div>
        <div class="row" id="comboRow" style="display:none"><span>连杀</span><span class="val" id="comboDisplay" style="color:#ff6644">×0</span></div>
        <div class="row"><span>血量</span><span class="val" id="hpDisplay">❤❤❤❤❤</span></div>
        <div class="row"><span>基地</span><span class="val" id="bufBase">❤❤❤❤❤</span></div>
        <div class="panel-section">[ 武器状态 ]</div>
        <div class="weapon-row"><span class="wpn-val" id="wpnBullet">○ 普通</span><span class="wpn-val" id="wpnShield">-</span></div>
        <div class="weapon-row"><span class="wpn-val" id="wpnDouble">-</span><span class="wpn-val" id="wpnAp">-</span></div>
        <div class="buff-row">
          <span class="buff-ind" id="bufShield">-</span>
          <span class="buff-ind" id="bufBullet">普通</span>
          <span class="buff-ind" id="bufDouble">-</span>
          <span class="buff-ind" id="bufAp">-</span>
          <span class="buff-ind" id="bufFreeze">-</span>
        </div>
        <div class="row" id="cheatRow" style="display:none"><span>作弊</span><span class="val" id="cheatLabel" style="color:#f44">无敌</span></div>
        <div class="row" id="p2lifeRow" style="display:none"><span>P2</span><span class="val" id="p2lives">3</span></div>
        <div class="pickup-notify" id="pickupNotify" style="display:none"></div>
      </div>
      <div class="mute-icon" id="muteBox">
        <span id="muteLabel">🔊 开启</span>
      </div>
      <div class="panel-hint">保护基地，消灭敌军！</div>
    </div>
  </div>
  <div id="overlay">
    <h1 id="ovTitle">坦克大战</h1>
    <p id="ovText"><span class="pc-only">操作说明：<br>W A S D 移动 &nbsp; J / 空格 开炮<br>↑ ↓ ← → 移动 &nbsp; K 开炮（双人）<br></span>P 暂停 &nbsp; M 菜单 &nbsp; R 重试本关<br>消灭所有敌方坦克，守住基地！<br><br>生存模式无限波次，看你能撑多久！</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
      <button class="btn" id="btn1p">单人模式</button>
      <button class="btn" id="btn2p">双人模式</button>
      <button class="btn" id="btnEndless">生存模式</button>
      <button class="btn" id="btnResume" style="display:none;background:#44aaff;color:#fff;">继续游戏</button>
      <button class="btn" id="btnRetry" style="display:none;background:#ff6c6c;color:#fff;">重新本关</button>
    </div>
  </div>
  <div id="upgradeOverlay" class="hidden" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(0,0,0,0.85);z-index:20;text-align:center;">
    <h2 style="color:#6cff6c;font-size:24px;margin-bottom:4px;">升级选择</h2>
    <p id="upgradeDesc" style="color:#ccc;font-size:14px;">选择一个永久升级</p>
    <div id="upgradeOptions" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;"></div>
  </div>
  <!-- 触屏控制 -->
  <div id="touch-controls">
    <div class="fire-wrap">
      <div class="fire-btn" id="btnFire">开火</div>
      <div class="tc-pause" id="btnPause">⏸</div>
      <div class="tc-pause" id="btnMenu" style="margin-top:4px;width:52px;height:30px;font-size:11px;">主菜单</div>
    </div>
  </div>
  <!-- 触屏控制提示 -->
  <div class="touch-hint">左屏幕滑动移动 · 右按钮射击</div>
</div>

<script>
(() => {
  const cv = document.getElementById('screen');
  const ctx = cv.getContext('2d');
  const TILE = 16, COLS = 26, ROWS = 32;
  const W = COLS * TILE, H = ROWS * TILE;

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const livesEl = document.getElementById('lives');
  const enemiesEl = document.getElementById('enemies');
  const bufShieldEl = document.getElementById('bufShield');
  const bufBulletEl = document.getElementById('bufBullet');
  const bufDoubleEl = document.getElementById('bufDouble');
  const bufBaseEl = document.getElementById('bufBase');
  const bufFreezeEl = document.getElementById('bufFreeze');
  const bufApEl = document.getElementById('bufAp');
  const hpDisplay = document.getElementById('hpDisplay');
  const comboRow = document.getElementById('comboRow');
  const comboDisplay = document.getElementById('comboDisplay');
  const wpnBullet = document.getElementById('wpnBullet');
  const wpnShield = document.getElementById('wpnShield');
  const wpnDouble = document.getElementById('wpnDouble');
  const wpnAp = document.getElementById('wpnAp');
  const p2livesEl = document.getElementById('p2lives');
  const p2lifeRow = document.getElementById('p2lifeRow');
  const btn1p = document.getElementById('btn1p');
  const btn2p = document.getElementById('btn2p');
  const btnRetry = document.getElementById('btnRetry');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');

  // 地图格子类型: 0空 1砖墙 2钢墙 3基地 4草地 5水域 6冰面
  let map = [];

    const DIR = { up: {x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
  const DIR_LIST = ['up','down','left','right'];

  let player, player2, enemies, bullets, base, particles, pickups, boss, ally;
  let score=0, level=1, lives=3, p2lives=3, running=false, paused=false, spawnTimer=0, pickupTimer=0;
  let shieldTimer=0, bulletUpgraded=false, doubleShot=false, baseShieldTimer=0, freezeTimer=0, allyRespawnTimer=0, apBulletTimer=0, shakeTimer=0, shakeIntensity=0;
  let permHP=0, permLives=0, permSpeed=0;
  let playerHP=5, playerMaxHP=5;
  let dualMode=false, upgradePending=false, muted=false, cheatInvincible=false, endlessMode=false, waveSpawned=false;
  let keys = {}, respawnTimer = null, p2respawnTimer = null, airdropTimer = 0, lastTime = 0;
  let hitStopTimer = 0;
  let enemiesKilledThisLevel = 0;
  const ICE_SLIDE_SPEED_FACTOR = 0.7;
  const ICE_SLIDE_DURATION = 8;
  let p1SlideTimer = 0, p1SlideDir = null, p1SlideSpeed = 0;
  let p2SlideTimer = 0, p2SlideDir = null, p2SlideSpeed = 0;
  let comboCount = 0, comboTimer = 0, comboDisplayTimer = 0;

  // ===== 音效 (Web Audio 8-bit 风格) =====
  let actx = null;
  function audio(){ if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function beep(freq, dur, type, vol){
    try {
      const a = audio();
      const o = a.createOscillator(), g = a.createGain();
      o.type = type||'square'; o.frequency.value = freq;
      g.gain.value = vol||0.1; g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime+dur);
    } catch(_){}
  }
  function mbeep(freq, dur, type, vol){ if (!muted) beep(freq, dur, type, vol); }
  const sfx = {
    shoot: () => mbeep(660 * (0.9 + Math.random() * 0.2), 0.08, 'square', 0.05),
    boom:  () => mbeep(120 * (0.9 + Math.random() * 0.2), 0.25, 'sawtooth', 0.09),
    hit:   () => mbeep(880 * (0.9 + Math.random() * 0.2), 0.05, 'square', 0.05),
    clank: () => mbeep(300 * (0.9 + Math.random() * 0.2), 0.04, 'square', 0.04),
    level: () => { if (!muted) { beep(523 * (0.9 + Math.random() * 0.2),0.1); setTimeout(()=>beep(784 * (0.9 + Math.random() * 0.2),0.15),100); }},
    powerup: () => { if (!muted) { beep(660 * (0.9 + Math.random() * 0.2),0.08); setTimeout(()=>beep(880 * (0.9 + Math.random() * 0.2),0.1),80); setTimeout(()=>beep(1100 * (0.9 + Math.random() * 0.2),0.12),160); }}
  };

  // BGM — 8-bit 循环旋律
  let bgmTimer = null, bgmIdx = 0;
  const BGM_MELODY = [
    [523,0.2],[659,0.2],[784,0.2],[659,0.2],
    [784,0.4],[659,0.2],[587,0.2],[523,0.2],
    [587,0.2],[659,0.2],[784,0.4],[784,0.2],
    [880,0.2],[784,0.2],[659,0.2],[587,0.2],
    [523,0.2],[659,0.2],[784,0.2],[1047,0.4],
    [784,0.2],[659,0.2],[587,0.4],[523,0.4],
  ];
  const BOSS_MELODY = [
    [262,0.3],[311,0.3],[349,0.3],[392,0.3],
    [349,0.2],[311,0.2],[262,0.4],[349,0.4],
    [262,0.3],[311,0.3],[349,0.3],[392,0.3],
    [440,0.2],[392,0.2],[349,0.4],[262,0.4],
  ];
  function bgmPlay(){
    bgmStop();
    if (!running || muted || paused) return;
    bgmIdx = 0; bgmNext();
  }
  function bgmNext(){
    if (!running || muted || paused) return bgmStop();
    const useBoss = level % 5 === 0 && boss && boss.alive;
    const melody = useBoss ? BOSS_MELODY : BGM_MELODY;
    const note = melody[bgmIdx % melody.length];
    mbeep(note[0], note[1]*0.8, useBoss ? 'sawtooth' : 'square', 0.03);
    bgmIdx++;
    bgmTimer = setTimeout(bgmNext, note[1]*1000 * 0.9);
  }
  function bgmStop(){
    if (bgmTimer){ clearTimeout(bgmTimer); bgmTimer = null; }
  }

  const LAYOUTS = [
    // 0: Crossroads — central steel cross, 4 open lanes, corner bricks
    function(){
      // Central steel cross
      for (let r=10;r<=20;r++) map[r][12]=2;
      for (let c=6;c<=19;c++) map[14][c]=2; map[14][12]=0;
      // Brick clusters in 4 corners
      for (let r=4;r<=7;r++) for (let c=3;c<=6;c++) if (map[r][c]===0) map[r][c]=1;
      for (let r=4;r<=7;r++) for (let c=19;c<=22;c++) if (map[r][c]===0) map[r][c]=1;
      for (let r=21;r<=24;r++) for (let c=3;c<=6;c++) if (map[r][c]===0) map[r][c]=1;
      for (let r=21;r<=24;r++) for (let c=19;c<=22;c++) if (map[r][c]===0) map[r][c]=1;
      // Grass along corridor edges
      for (let i=0;i<6;i++){ const r=4+((Math.random()*24)|0),c=8+((Math.random()*10)|0); if (map[r][c]===0) map[r][c]=4; }
    },
    // 1: Twin Rivers — two vertical water channels, brick bridges, ice center
    function(){
      // Two water channels
      for (let r=3;r<=28;r++){ if (map[r][8]===0) map[r][8]=5; if (map[r][17]===0) map[r][17]=5; }
      // Brick bridges across rivers
      for (let c=9;c<=16;c++){ if (map[8][c]===0) map[8][c]=1; if (map[20][c]===0) map[20][c]=1; }
      // Steel pillars at bridge entrances
      map[8][8]=2; map[8][17]=2; map[20][8]=2; map[20][17]=2;
      // Ice patches near center
      for (let r=11;r<=13;r++) for (let c=11;c<=14;c++) if (map[r][c]===0) map[r][c]=6;
      // Grass along edges
      for (let i=0;i<6;i++){ const r=5+((Math.random()*22)|0),c=2+((Math.random()*3)|0); if (map[r][c]===0) map[r][c]=4; }
      for (let i=0;i<6;i++){ const r=5+((Math.random()*22)|0),c=22+((Math.random()*3)|0); if (map[r][c]===0) map[r][c]=4; }
    },
    // 2: Fortress — brick fortress top, steel walls bottom, open flanks
    function(){
      // Enemy brick fortress top-center
      for (let r=4;r<=8;r++) for (let c=8;c<=17;c++) if (map[r][c]===0) map[r][c]=1;
      map[4][12]=0; map[4][13]=0; // entrance gap
      // Player steel walls near base
      for (let c=8;c<=17;c++){ if (map[23][c]===0) map[23][c]=2; }
      map[23][12]=0; map[23][13]=0; // gap for access
      // Grass on flanks
      for (let i=0;i<4;i++){ const r=10+((Math.random()*14)|0),c=2+((Math.random()*4)|0); if (map[r][c]===0) map[r][c]=4; }
      for (let i=0;i<4;i++){ const r=10+((Math.random()*14)|0),c=19+((Math.random()*4)|0); if (map[r][c]===0) map[r][c]=4; }
    },
    // 3: Ice Field — large ice patches, scattered bricks, steel columns, water corners
    function(){
      // Ice patches mid-left and mid-right
      for (let r=8;r<=14;r++) for (let c=3;c<=8;c++) if (map[r][c]===0) map[r][c]=6;
      for (let r=8;r<=14;r++) for (let c=17;c<=22;c++) if (map[r][c]===0) map[r][c]=6;
      // Scattered bricks
      for (let r=5;r<=8;r++) for (let c=11;c<=14;c++) if (map[r][c]===0) map[r][c]=1;
      for (let r=18;r<=21;r++) for (let c=11;c<=14;c++) if (map[r][c]===0) map[r][c]=1;
      // Steel columns at intersections
      map[10][10]=2; map[10][15]=2; map[18][10]=2; map[18][15]=2;
      // Water pools at corners
      map[4][4]=5; map[4][21]=5; map[24][4]=5; map[24][21]=5;
    },
    // 4: Arena — octagonal brick ring, steel corner posts, grass exterior, water far corners
    function(){
      // Octagonal center ring (brick, destructible)
      for (let a=0;a<8;a++){
        const angle = a*Math.PI/4;
        for (let d=4;d<=6;d++){
          const r = (14 + Math.sin(angle)*d)|0, c = (13 + Math.cos(angle)*d)|0;
          if (r>=3&&r<ROWS-2&&c>=3&&c<COLS-2) map[r][c]=1;
        }
      }
      // 4 steel corner posts
      for (let i=0;i<4;i++){ const r=5+i*7; map[r][5]=2; map[r][20]=2; }
      // Grass surrounding the ring exterior
      for (let i=0;i<8;i++){ const r=6+((Math.random()*20)|0),c=7+((Math.random()*3)|0); if (map[r][c]===0) map[r][c]=4; }
      for (let i=0;i<8;i++){ const r=6+((Math.random()*20)|0),c=15+((Math.random()*3)|0); if (map[r][c]===0) map[r][c]=4; }
      // Water in far corners
      map[3][3]=5; map[3][22]=5; map[26][3]=5; map[26][22]=5;
    },
    // 5: Stronghold — central steel diamond, narrow brick corridors, grass/ice edges
    function(){
      // Central steel diamond fortress
      for (let r=10;r<=18;r++) for (let c=9;c<=16;c++) if (map[r][c]===0){
        if (r===10||r===18||c===9||c===16){ map[r][c]=2; } else { map[r][c]=1; }
      }
      // Open entrances
      map[10][12]=0; map[18][12]=0; map[14][9]=0; map[14][16]=0;
      // Narrow brick corridors leading in
      for (let r=7;r<=9;r++) for (let c=11;c<=14;c++) if (map[r][c]===0) map[r][c]=1;
      for (let r=19;r<=21;r++) for (let c=11;c<=14;c++) if (map[r][c]===0) map[r][c]=1;
      // Grass on top and bottom edges
      for (let i=0;i<5;i++){ const r=3+((Math.random()*3)|0),c=5+((Math.random()*16)|0); if (map[r][c]===0) map[r][c]=4; }
      for (let i=0;i<5;i++){ const r=25+((Math.random()*3)|0),c=5+((Math.random()*16)|0); if (map[r][c]===0) map[r][c]=4; }
      // Ice patches on left/right edges
      for (let r=10;r<=18;r++){ if (map[r][3]===0) map[r][3]=6; if (map[r][22]===0) map[r][22]=6; }
    },
  ];

  function emptyMap() {
    map = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    // 边界钢墙
    for (let c=0;c<COLS;c++){ map[0][c]=2; map[ROWS-1][c]=2; }
    for (let r=0;r<ROWS;r++){ map[r][0]=2; map[r][COLS-1]=2; }
    // 基地 (底部中央)，提前定义 bc 供布局使用
    const br = ROWS-2, bc = (COLS/2)|0;
    // 预设地图布局
    const layoutIdx = (level-1) % LAYOUTS.length;
    LAYOUTS[layoutIdx]();
    // 随机补砖（填补空旷区域）
    for (let i=0;i<10;i++){
      const r = 3+((Math.random()*(ROWS-6))|0), c = 3+((Math.random()*(COLS-6))|0);
      if (map[r][c]===0 && !(r>=ROWS-4 && c>=bc-4 && c<=bc+4)) map[r][c]=1;
    }
    // 草地（关卡 >= 1）
    const gc = 6 + level * 2;
    for (let i=0;i<gc;i++){
      const r = 4+((Math.random()*(ROWS-8))|0), c = 4+((Math.random()*(COLS-8))|0);
      if (map[r][c]===0) map[r][c]=4;
    }
    // 水域（关卡 >= 3，仅限中间区域，不阻挡基地通道）
    if (level >= 3){
      for (let i=0;i<2+level;i++){
        const r = 5+((Math.random()*12)|0), c = 5+((Math.random()*12)|0);
        if (map[r][c]===0) map[r][c]=5;
        if (Math.random()<0.4 && r+1<22 && map[r+1][c]===0) map[r+1][c]=5;
      }
    }
    // 冰面（关卡 >= 5，仅限中间区域）
    if (level >= 5){
      for (let i=0;i<2+Math.min(level,3);i++){
        const r = 5+((Math.random()*12)|0), c = 5+((Math.random()*12)|0);
        if (map[r][c]===0) map[r][c]=6;
      }
    }
    // 清理3个敌人生成点
    for (const c of [2, (COLS/2)|0, COLS-3]) { map[2][c]=0; }
    // 清理玩家生成区域 (col 3~4, row 23~24)
    for (let r=ROWS-3;r<=ROWS-2;r++) for (let c=3;c<=4;c++) if (r>=0&&c>=0&&r<ROWS&&c<COLS) map[r][c]=0;
    // 清理P2生成区域 (col 22~23)
    for (let r=ROWS-3;r<=ROWS-2;r++) for (let c=22;c<=23;c++) if (r>=0&&c>=0&&r<ROWS&&c<COLS) map[r][c]=0;
    // 基地 (底部中央)
    map[br][bc]=3;
    // 基地双层砖墙
    for (let r=br-2;r<=br;r++) for (let c=bc-2;c<=bc+2;c++){
      if (r>=0&&c>=0&&r<ROWS&&c<COLS && map[r][c]===0 && !(r===br && c===bc)) map[r][c]=1;
    }
    base = { r: br, c: bc, alive: true, hp: 5, maxHp: 5 };
  }

  function generateBossArena() {
    map = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    for (let c=0;c<COLS;c++){ map[0][c]=2; map[ROWS-1][c]=2; }
    for (let r=0;r<ROWS;r++){ map[r][0]=2; map[r][COLS-1]=2; }
    // 4 brick pillars
    const pillars = [[5,5],[5,20],[19,5],[19,20]];
    for (const [r,c] of pillars) {
      for (let dr=0;dr<2;dr++) for (let dc=0;dc<2;dc++) {
        if (r+dr>0&&r+dr<ROWS-1&&c+dc>0&&c+dc<COLS-1) map[r+dr][c+dc]=1;
      }
    }
    // Central steel columns
    for (const c of [10,15]) for (const r of [10,15]) map[r][c]=2;
    // Side brick cover
    for (let r=7;r<=9;r++){ map[r][3]=1; map[r][22]=1; }
    for (let r=17;r<=19;r++){ map[r][3]=1; map[r][22]=1; }
    // Grass ambush points
    for (let i=0;i<8;i++){ const r=6+((Math.random()*20)|0),c=8+((Math.random()*10)|0); if (map[r][c]===0) map[r][c]=4; }
    // Clear spawn points
    for (const c of [2, (COLS/2)|0, COLS-3]) { map[2][c]=0; }
    for (let r=ROWS-3;r<=ROWS-2;r++) for (let c=3;c<=4;c++) map[r][c]=0;
    for (let r=ROWS-3;r<=ROWS-2;r++) for (let c=22;c<=23;c++) map[r][c]=0;
    // Base
    const br = ROWS-2, bc = (COLS/2)|0;
    map[br][bc]=3;
    for (let r=br-2;r<=br;r++) for (let c=bc-2;c<=bc+2;c++) {
      if (r>=0&&c>=0&&r<ROWS&&c<COLS && map[r][c]===0 && !(r===br && c===bc)) map[r][c]=1;
    }
    base = { r: br, c: bc, alive: true, hp: 5, maxHp: 5 };
  }

  function spawnBoss() {
    const bLevel = Math.floor(level / 5);
    boss = {
      x: 10*TILE, y: 4*TILE, w: TILE*2, h: TILE*2,
      dir: 'down', speed: 0.5 + bLevel * 0.03,
      hp: 8 + bLevel * 3, maxHp: 8 + bLevel * 3,
      cooldown: 0, alive: true,
      color: bLevel === 1 ? '#aa44cc' : bLevel === 2 ? '#dd3333' : '#ffaa00',
      moveTimer: 0, moveDir: null, enraged: false,
