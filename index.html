    };
  }

  function makeTank(isPlayer, enemyType) {
    const spd = isPlayer ? (1.2 + permSpeed * 0.15) : (0.4 + Math.min(level-1, 6) * 0.08);
    const t = {
      isPlayer,
      x: 0, y: 0, w: TILE, h: TILE,
      dir: isPlayer ? 'up' : 'down',
      speed: spd,
      cooldown: 0,
      alive: true,
      color: isPlayer ? '#6cff6c' : '#ff6c6c',
      aiTimer: 0, aiDir: null,
      hp: 1, rapid: false,
      type: 'normal'
    };
    if (!isPlayer && enemyType){
      t.hp = enemyType.hp || 1;
      t.rapid = enemyType.rapid || false;
      t.type = enemyType.type || 'normal';
      if (t.type === 'scout'){ t.color = '#dddd44'; t.speed *= 1.6; }
      else if (t.type === 'suicide'){ t.color = '#ff2222'; t.speed *= 1.3; }
      else if (t.type === 'armored' || t.type === 'elite') t.color = '#cc4444';
      else if (t.type === 'rapid') t.color = '#ff44aa';
    }
    return t;
  }

  function spawnPlayer(fullHP) {
    // 清除重生位置的砖块
    for (let r=ROWS-3;r<=ROWS-2;r++) for (let c=3;c<=4;c++) if (r>=0&&c>=0&&r<ROWS&&c<COLS&&map[r][c]===1) map[r][c]=0;
    player = makeTank(true);
    player.x = 3 * TILE; player.y = (ROWS-3) * TILE;
    if (fullHP !== false) playerHP = playerMaxHP;
    updateHPDisplay();
    if (dualMode){
      for (let r=ROWS-3;r<=ROWS-2;r++) for (let c=22;c<=23;c++) if (r>=0&&c>=0&&r<ROWS&&c<COLS&&map[r][c]===1) map[r][c]=0;
      player2 = makeTank(true);
      player2.x = 22 * TILE; player2.y = (ROWS-3) * TILE;
      player2.color = '#4488ff';
    }
  }

  function spawnAlly(){
    for (let r=ROWS-3;r<=ROWS-2;r++) for (let c=20;c<=21;c++) if (r>=0&&c>=0&&r<ROWS&&c<COLS&&map[r][c]===1) map[r][c]=0;
    ally = makeTank(true);
    ally.x = 20 * TILE; ally.y = (ROWS-3) * TILE;
    ally.color = '#44ddff';
    ally.speed = 0.9;
    ally.hp = 2;
    ally.maxHp = 2;
    ally.isAirdrop = false;
  }

  function spawnAirdrop(){
    if (ally && ally.alive) return;
    for (let i=0;i<30;i++){
      const c = 4 + ((Math.random()*(COLS-8))|0);
      const r = 4 + ((Math.random()*(ROWS-10))|0);
      if (map[r][c]!==0) continue;
      const x=c*TILE, y=r*TILE;
      if (player.alive && rectsOverlap({x,y,w:TILE,h:TILE},player)) continue;
      let blocked=false;
      for (const e of enemies) if (rectsOverlap({x,y,w:TILE,h:TILE},e)){ blocked=true; break; }
      if (blocked) continue;
      ally = makeTank(true);
      ally.x = x; ally.y = -TILE;
      ally.color = '#44ddff';
      ally.speed = 0.7;
      ally.hp = 2;
      ally.maxHp = 2;
      ally.isAirdrop = true;
      ally.dropIn = 60;
      ally.targetY = y;
      return;
    }
  }

  function spawnPickup(){
    if (pickups.length >= 3) return;
    // 只生成当前未激活的技能类型
    const available = [];
    if (shieldTimer <= 0) available.push('shield');
    if (!bulletUpgraded) available.push('bullet');
    if (!doubleShot) available.push('doubleshot');
    if (baseShieldTimer <= 0) available.push('baseshield');
    if (freezeTimer <= 0) available.push('freeze');
    if (apBulletTimer <= 0) available.push('apbullet');
    available.push('repair');
    available.push('bomb');
    available.push('medkit');
    if (available.length === 0) return;
    for (let i=0;i<50;i++){
      const r = 4 + ((Math.random()*(ROWS-8))|0);
      const c = 4 + ((Math.random()*(COLS-8))|0);
      if (map[r][c]!==0) continue;
      // 检查这个位置有没有坦克
      const x=c*TILE, y=r*TILE;
      if (player.alive && rectsOverlap({x,y,w:TILE,h:TILE},player)) continue;
      let blocked=false;
      for (const e of enemies) if (rectsOverlap({x,y,w:TILE,h:TILE},e)){ blocked=true; break; }
      if (blocked) continue;
      const type = available[(Math.random()*available.length)|0];
      pickups.push({x,y,w:TILE,h:TILE,type});
      return;
    }
  }

  function spawnDrop(e){
    if (Math.random() >= 0.3) return;
    if (pickups.length >= 3) return;
    const types = ['shield','bullet','doubleshot','baseshield','freeze','bomb','apbullet','repair','medkit'];
    const available = types.filter(t => {
      if (t==='shield' && shieldTimer>0) return false;
      if (t==='bullet' && bulletUpgraded) return false;
      if (t==='doubleshot' && doubleShot) return false;
      if (t==='baseshield' && baseShieldTimer>0) return false;
      if (t==='freeze' && freezeTimer>0) return false;
      if (t==='apbullet' && apBulletTimer>0) return false;
      return true;
    });
    if (available.length===0) return;
    const type = available[(Math.random()*available.length)|0];
    pickups.push({x:e.x, y:e.y, w:TILE, h:TILE, type});
  }

  function spawnEnemy() {
    const spotsX = [2*TILE, ((COLS/2)|0)*TILE, (COLS-3)*TILE];
    const spotsY = 2*TILE;
    // 随机打乱尝试
    for (let i=spotsX.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [spotsX[i],spotsX[j]]=[spotsX[j],spotsX[i]]; }
    // 根据等级选择敌人类型
    let enemyType = {hp:1, rapid:false, type:'normal'};
    const r = Math.random();
    if (level >= 7) {
      if (r < 0.35) enemyType = {hp:3, rapid:true, type:'elite'};
      else if (r < 0.50) enemyType = {hp:2, rapid:true, type:'rapid'};
      else if (r < 0.62) enemyType = {hp:1, rapid:false, type:'suicide'};
      else if (r < 0.74) enemyType = {hp:2, rapid:false, type:'armored'};
      else if (r < 0.82) enemyType = {hp:1, rapid:false, type:'scout'};
    } else if (level >= 5) {
      if (r < 0.25) enemyType = {hp:2, rapid:true, type:'rapid'};
      else if (r < 0.40) enemyType = {hp:1, rapid:false, type:'suicide'};
      else if (r < 0.60) enemyType = {hp:2, rapid:false, type:'armored'};
      else if (r < 0.70) enemyType = {hp:1, rapid:false, type:'scout'};
    } else if (level >= 4) {
      if (r < 0.20) enemyType = {hp:1, rapid:false, type:'suicide'};
      else if (r < 0.45) enemyType = {hp:2, rapid:false, type:'armored'};
      else if (r < 0.55) enemyType = {hp:1, rapid:false, type:'scout'};
    } else if (level >= 3) {
      if (r < 0.30) enemyType = {hp:2, rapid:false, type:'armored'};
      else if (r < 0.40) enemyType = {hp:1, rapid:false, type:'scout'};
    } else if (level >= 2) {
      if (r < 0.15) enemyType = {hp:1, rapid:false, type:'scout'};
    }
    for (const x of spotsX){
      if (!canMove({x,y:spotsY,w:TILE,h:TILE}, x, spotsY)) continue;
      const e = makeTank(false, enemyType);
      e.x = x; e.y = spotsY;
      e.dir = 'down';
      enemies.push(e);
      waveSpawned = true;
      return;
    }
    // 三个点都被占，等待下次
  }

  function rectsOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

  function tileAt(px,py){
    const c = (px/TILE)|0, r=(py/TILE)|0;
    if (r<0||c<0||r>=ROWS||c>=COLS) return 2;
    return map[r][c];
  }

  function canMove(t, nx, ny) {
    // 检查四角所在格
    const pts = [[nx,ny],[nx+t.w-1,ny],[nx,ny+t.h-1],[nx+t.w-1,ny+t.h-1]];
    for (const [x,y] of pts){
      const v = tileAt(x,y);
      if (v===1||v===2||v===3||v===5) return false;
    }
    // 不重叠其他坦克（自爆兵除外：需要碰到目标才能爆炸）
    const box = {x:nx,y:ny,w:t.w,h:t.h};
    if (t.type !== 'suicide' && t!==player && player.alive && rectsOverlap(box,player)) return false;
    if (dualMode && t.type !== 'suicide' && t!==player2 && player2 && player2.alive && rectsOverlap(box,player2)) return false;
    if (ally && ally.alive && t!==ally && rectsOverlap(box,ally)) return false;
    for (const e of enemies) if (e!==t && e.alive && rectsOverlap(box,e)) return false;
    return true;
  }

  function moveTank(t, dt) {
    const d = DIR[t.dir];
    const nx = t.x + d.x*t.speed*dt, ny = t.y + d.y*t.speed*dt;
    if (canMove(t, nx, ny)) { t.x = nx; t.y = ny; }
  }

  // 视线检测：两点之间是否有砖/钢墙阻挡
  function hasLineOfSight(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 1) return true;
    const steps = Math.ceil(dist / (TILE * 0.6));
    for (let i = 0; i <= steps; i++) {
      const px = x1 + dx * (i / steps);
      const py = y1 + dy * (i / steps);
      const tc = Math.floor(px / TILE);
      const tr = Math.floor(py / TILE);
      if (tc < 0 || tc >= COLS || tr < 0 || tr >= ROWS) return false;
      const tile = map[tr][tc];
      if (tile === 1 || tile === 2) return false; // brick/steel blocks
    }
    return true;
  }

  function shoot(t) {
    if (t.cooldown > 0) return;
    t.cooldown = t.isPlayer ? 28 : (t.rapid ? 30 : 50);
    const d = DIR[t.dir];
    const speed = t.isPlayer && bulletUpgraded ? 4 : 2.4;
    const s = t.isPlayer && bulletUpgraded ? 5 : 4;
    const perp = d.x ? {x:0,y:-1} : {x:1,y:0};
    const cx = t.x + (t.w - s) / 2, cy = t.y + (t.h - s) / 2;
    const count = (t.isPlayer && doubleShot) || (!t.isPlayer && t.rapid) ? 2 : 1;
    for (let i=0;i<count;i++){
      const off = count > 1 ? (i * 2 - 1) * 3 : 0;
      bullets.push({
        x: cx + d.x * t.w / 2 + perp.x * off,
        y: cy + d.y * t.h / 2 + perp.y * off,
        vx: d.x*speed, vy: d.y*speed,
        from: t.isPlayer ? 'p' : 'e',
        w:s, h:s
      });
    }
    sfx.shoot();
  }

  function tankToRect(t){ return {x:t.x,y:t.y,w:t.w,h:t.h}; }

  function explode(x,y,color,isBoss){
    const count = isBoss ? 40 : 20;
    for (let i=0;i<count;i++){
      const size = 1 + ((Math.random() * 3) | 0); // 1-3px
      particles.push({
        x, y,
        vx: (Math.random()-0.5) * (isBoss ? 6 : 4),
        vy: (Math.random()-0.5) * (isBoss ? 6 : 4),
        life: isBoss ? 35 : 20,
        color: i < count/2 ? color : (Math.random()<0.5?'#fff':'#ff8'),
        size
      });
    }
    sfx.boom();
  }
  function shake(t,i){ shakeTimer=Math.max(shakeTimer,t); shakeIntensity=Math.max(shakeIntensity,i); }

  function updateHPDisplay(){
    const hearts = '❤'.repeat(Math.max(0, playerHP)) + '🖤'.repeat(Math.max(0, playerMaxHP - playerHP));
    hpDisplay.textContent = hearts || '死';
  }

  function update(dt) {
    if (paused || !running) return;
    if (hitStopTimer > 0) { hitStopTimer -= dt; }

    if (player.alive) {
      const p1OnIce = tileAt(player.x+8, player.y+8) === 6;
      const p1HasKey = keys['w'] || keys['s'] || keys['a'] || keys['d'];
      if (p1SlideTimer > 0) {
        player.dir = p1SlideDir;
        const sd = DIR[p1SlideDir];
        const snx = player.x + sd.x * p1SlideSpeed * dt, sny = player.y + sd.y * p1SlideSpeed * dt;
        if (canMove(player, snx, sny)) { player.x = snx; player.y = sny; } else { p1SlideTimer = 0; }
        p1SlideTimer -= dt;
        if (p1SlideTimer <= 0) { p1SlideTimer = 0; p1SlideDir = null; p1SlideSpeed = 0; }
      } else if (p1HasKey) {
        if (keys['w']) { player.dir='up'; moveTank(player, dt); }
        else if (keys['s']) { player.dir='down'; moveTank(player, dt); }
        else if (keys['a']) { player.dir='left'; moveTank(player, dt); }
        else if (keys['d']) { player.dir='right'; moveTank(player, dt); }
        if (p1OnIce) { p1SlideDir = player.dir; p1SlideSpeed = player.speed * ICE_SLIDE_SPEED_FACTOR; }
      } else if (p1OnIce && p1SlideDir) {
        p1SlideTimer = ICE_SLIDE_DURATION;
      } else if (!p1OnIce) {
        p1SlideDir = null; p1SlideSpeed = 0;
      }
      if (player.cooldown>0) player.cooldown-=dt;
      if (keys['j']||keys[' ']) shoot(player);
    }
    if (dualMode && player2 && player2.alive) {
      const p2OnIce = tileAt(player2.x+8, player2.y+8) === 6;
      const p2HasKey = keys['ArrowUp'] || keys['ArrowDown'] || keys['ArrowLeft'] || keys['ArrowRight'];
      if (p2SlideTimer > 0) {
        player2.dir = p2SlideDir;
        const sd2 = DIR[p2SlideDir];
        const snx2 = player2.x + sd2.x * p2SlideSpeed * dt, sny2 = player2.y + sd2.y * p2SlideSpeed * dt;
        if (canMove(player2, snx2, sny2)) { player2.x = snx2; player2.y = sny2; } else { p2SlideTimer = 0; }
        p2SlideTimer -= dt;
        if (p2SlideTimer <= 0) { p2SlideTimer = 0; p2SlideDir = null; p2SlideSpeed = 0; }
      } else if (p2HasKey) {
        if (keys['ArrowUp']) { player2.dir='up'; moveTank(player2, dt); }
        else if (keys['ArrowDown']) { player2.dir='down'; moveTank(player2, dt); }
        else if (keys['ArrowLeft']) { player2.dir='left'; moveTank(player2, dt); }
        else if (keys['ArrowRight']) { player2.dir='right'; moveTank(player2, dt); }
        if (p2OnIce) { p2SlideDir = player2.dir; p2SlideSpeed = player2.speed * ICE_SLIDE_SPEED_FACTOR; }
      } else if (p2OnIce && p2SlideDir) {
        p2SlideTimer = ICE_SLIDE_DURATION;
      } else if (!p2OnIce) {
        p2SlideDir = null; p2SlideSpeed = 0;
      }
      if (player2.cooldown>0) player2.cooldown-=dt;
      if (keys['k']) shoot(player2);
    }

    // 敌人AI（视线追踪 + 方向持久 + 智能绕路）
    for (const e of enemies) {
      if (!e.alive) continue;
      if (freezeTimer > 0) continue;
      e.aiTimer-=dt;
      if (e.stuckFrames===undefined) e.stuckFrames=0;
      if (e.movePersist===undefined) e.movePersist=0;
      // 视线检测
      const canSeePlayer = player && player.alive &&
        hasLineOfSight(e.x+e.w/2, e.y+e.h/2, player.x+player.w/2, player.y+player.h/2) &&
        (e.seeDist||12) * TILE >= Math.hypot(player.x-e.x, player.y-e.y);
      const basePos = {x:base.c*TILE+TILE/2, y:base.r*TILE+TILE/2, alive:true};
      const canSeeBase = hasLineOfSight(e.x+e.w/2, e.y+e.h/2, basePos.x, basePos.y);
      // 决定方向（方向持久：aiTimer控制重评估间隔）
      if (e.aiTimer<=0 || !e.aiDir) {
        if (e.type === 'suicide') {
          const target = (dualMode && player2 && player2.alive && Math.random()<0.5) ? player2 : player;
          if (canSeePlayer && target) {
            e.aiDir = dirTowards(e, target);
            e.movePersist = 12 + ((Math.random()*8)|0);
          } else {
            e.aiDir = dirTowards(e, basePos);
            e.movePersist = 20 + ((Math.random()*15)|0);
          }
        } else if (e.type === 'scout') {
          e.aiDir = dirTowards(e, basePos);
          e.movePersist = 60;
        } else {
          // 普通敌人：看到玩家→追（80%），看不到→随机往玩家方向/基地方向走
          if (canSeePlayer) {
            if (Math.random() < 0.8) {
              e.aiDir = dirTowards(e, player);
              e.movePersist = 12 + ((Math.random()*10)|0);
            } else {
              e.aiDir = dirSideways(e, player);
              e.movePersist = 8 + ((Math.random()*8)|0);
            }
          } else {
            const r = Math.random();
            const seekP = 0.25 + Math.min(level-1, 8) * 0.04;
            if (r < seekP && player && player.alive) {
              e.aiDir = dirTowards(e, player);
              e.movePersist = 15 + ((Math.random()*15)|0);
            } else if (r < seekP + 0.25) {
              e.aiDir = dirTowards(e, basePos);
              e.movePersist = 20 + ((Math.random()*15)|0);
            } else {
              e.aiDir = DIR_LIST[(Math.random()*4)|0];
              e.movePersist = 25 + ((Math.random()*20)|0);
            }
          }
        }
        e.dir = e.aiDir;
        e.aiTimer = e.movePersist;
        e.stuckFrames = 0;
      }
      // 前方砖墙？开火击碎
      if (e.cooldown <= 0 && e.type !== 'scout' && e.type !== 'suicide') {
        if (tileAhead(e) === 1) shoot(e);
      }
      // 移动 + 卡住处理
      const before = {x:e.x, y:e.y};
      moveTank(e, dt);
      if (before.x===e.x && before.y===e.y) {
        e.stuckFrames++;
        if (e.stuckFrames > 8) {
          const ahead = tileAhead(e);
          const isHard = ahead === 2 || ahead === 5;
          const getTarget = () => {
            if (e.type === 'suicide') return (player&&player.alive?player:basePos);
            if (e.type === 'scout') return basePos;
            return (player&&player.alive?player:null);
          };
          if (isHard) {
            // 钢墙→选绕路方向
            const perpDirs = e.dir==='up'||e.dir==='down'?['left','right']:['up','down'];
            e.dir = bestDir(perpDirs, e, getTarget());
            e.aiDir = e.dir; e.aiTimer = 6+((Math.random()*8)|0);
          } else if (e.stuckFrames > 15) {
            // 严重卡死→先掉头再重定向
            const opp = {up:'down',down:'up',left:'right',right:'left'}[e.dir];
            e.dir = opp; e.aiDir = opp;
            moveTank(e, dt);
            if (before.x===e.x && before.y===e.y) {
              // 还是卡→最宽方向
              e.dir = bestOpenDir(e);
              e.aiDir = e.dir; e.aiTimer = 5;
            } else { e.aiTimer = 8; }
          } else {
            // 轻微卡→换垂直方向
            const perp = e.dir==='up'||e.dir==='down'?['left','right']:['up','down'];
            e.dir = perp[(Math.random()*2)|0]; e.aiDir = e.dir;
            e.aiTimer = 4+((Math.random()*6)|0);
          }
          e.stuckFrames = 0;
        }
      } else {
        if (e.stuckFrames > 0) e.stuckFrames = Math.max(0, e.stuckFrames-3);
      }
      // 自爆兵：接触玩家或基地即爆炸
      if (e.type === 'suicide' && e.alive) {
        let hit = false;
        if (player.alive && rectsOverlap(e, player)){
          if (!cheatInvincible && shieldTimer <= 0){
            playerHP = Math.max(playerHP - 2, 0);
            updateHPDisplay();
            if (playerHP <= 0){
               explode(player.x+player.w/2,player.y+player.h/2,player.color);
               player.alive = false; lives--; livesEl.textContent=lives;
               comboCount = 0; comboTimer = 0;
              if (dualMode){ if (lives<=0 && p2lives<=0) gameOver(false); }
              else if (lives<=0) gameOver(false);
              else respawnTimer = setTimeout(()=>{ if (running) spawnPlayer(); }, 800);
            }
          }
          hit = true;
        }
        if (!hit && dualMode && player2 && player2.alive && rectsOverlap(e, player2)){
          player2.alive = false; p2lives--; p2livesEl.textContent=p2lives; hit = true;
          if (p2lives<=0 && lives<=0) gameOver(false);
          else p2respawnTimer = setTimeout(()=>{
            if (!dualMode || !running) return;
            for (let r=ROWS-3;r<=ROWS-2;r++) for (let c=22;c<=23;c++) if (map[r]&&map[r][c]===1) map[r][c]=0;
            player2 = makeTank(true);
            player2.x=22*TILE; player2.y=(ROWS-3)*TILE; player2.color='#4488ff';
          }, 800);
        }
        if (!hit){
          const pts = [[e.x,e.y],[e.x+e.w-1,e.y],[e.x,e.y+e.h-1],[e.x+e.w-1,e.y+e.h-1]];
          let hc = -1, hr = -1;
          for (const [x,y] of pts){
            const tc = (x/TILE)|0, tr = (y/TILE)|0;
            if (tr>=0&&tc>=0&&tr<ROWS&&tc<COLS && map[tr][tc]===3){ hc=tc; hr=tr; break; }
          }
          if (hc>=0 && baseShieldTimer<=0 && base.alive){
            base.hp -= 2;
            if (base.hp <= 0){ base.alive=false; map[hr][hc]=0; gameOver(false); }
            else { explode(hr*TILE,hc*TILE,'#ff6600'); sfx.boom(); }
            hit = true;
          }
        }
        if (hit){
          e.alive = false;
          explode(e.x+e.w/2, e.y+e.h/2, '#ff6600');
          sfx.boom();
          if (!running) continue;
          if (lives<=0 && (!dualMode || p2lives<=0)) gameOver(false);
        }
      }
      if (e.cooldown>0) e.cooldown-=dt;
      // 侦察兵: 摸到基地触发报警，立刻刷 2 个增援
      if (e.type === 'scout' && e.alive && !e.scoutAlerted) {
        const dx = e.x - base.c * TILE, dy = e.y - base.r * TILE;
        if (dx*dx + dy*dy < TILE * TILE * 25) { // 5格范围内
          e.scoutAlerted = true;
          e.alive = false;
          explode(e.x+e.w/2, e.y+e.h/2, '#ff4444');
          sfx.boom();
          shake(8, 3);
          for (let i=0;i<2;i++) spawnEnemy();
        }
      }
      // 侦察兵和自爆兵不开火
      if (e.type !== 'scout' && e.type !== 'suicide') {
        const aligned = player && player.alive && (
          (e.dir === 'up' || e.dir === 'down')
            ? Math.abs(e.x - player.x) < 12
            : Math.abs(e.y - player.y) < 12
        );
        const baseChance = 0.004 + Math.min(level-1, 6) * 0.002;
        const shootChance = aligned ? baseChance * 3 : baseChance;
        if (Math.random() < shootChance && player && player.alive && hasLineOfSight(e.x+e.w/2, e.y+e.h/2, player.x+player.w/2, player.y+player.h/2)) shoot(e);
      }
    }

    // Boss AI
    if (boss && boss.alive && freezeTimer <= 0) {
      boss.moveTimer-=dt;
      if (boss.cooldown > 0) boss.cooldown-=dt;
      if (boss.phaseFlash > 0) boss.phaseFlash -= dt;
      // Phase 2 transition (one-shot at 50% HP)
      if (!boss.phaseTriggered && boss.hp <= boss.maxHp / 2) {
        boss.phaseTriggered = true;
        boss.phaseFlash = 30;
        shake(8, 3);
        if (!muted) { beep(200, 0.3, 'sawtooth', 0.08); }
      }
      const enraged = boss.hp <= boss.maxHp / 2;
      const spd = enraged ? boss.speed * 1.15 : boss.speed;
      if (boss.moveTimer <= 0 || !boss.moveDir) {
        const r = Math.random();
        if (r < 0.5) boss.moveDir = dirTowards(boss, player);
        else if (r < 0.7) boss.moveDir = Math.random()<0.5 ? 'left' : 'right';
        else boss.moveDir = dirTowards(boss, {x:base.c*TILE, y:base.r*TILE, alive:true});
        boss.dir = boss.moveDir;
        boss.moveTimer = 25 + ((Math.random()*35)|0);
      }
      const d = DIR[boss.moveDir];
      const nx = boss.x + d.x * spd * dt, ny = boss.y + d.y * spd * dt;
      if (canMove(boss, nx, ny)) { boss.x = nx; boss.y = ny; }
      if (boss.cooldown <= 0 && player && player.alive && hasLineOfSight(boss.x+boss.w/2, boss.y+boss.h/2, player.x+player.w/2, player.y+player.h/2)) {
        const bulletCount = 1 + Math.floor(level / 10);
        const perp = d.x ? {x:0,y:-1} : {x:1,y:0};
        const cx = boss.x + boss.w/2, cy = boss.y + boss.h/2;
        for (let i=0;i<bulletCount;i++) {
          const off = (i - (bulletCount-1)/2) * 7;
          bullets.push({
            x: cx + d.x*(boss.w/2) + perp.x*off - 3,
            y: cy + d.y*(boss.h/2) + perp.y*off - 3,
            vx: d.x * 2.5, vy: d.y * 2.5,
            from: 'e', w: 6, h: 6
          });
        }
        boss.cooldown = enraged ? 30 : 50;
        sfx.shoot();
      }
      // Phase 2 burst (fires alongside normal shot)
      if (boss.phaseTriggered) {
        if (boss.phaseBurstCooldown > 0) boss.phaseBurstCooldown -= dt;
        if (boss.phaseBurstCooldown <= 0 && player && player.alive && hasLineOfSight(boss.x+boss.w/2, boss.y+boss.h/2, player.x+player.w/2, player.y+player.h/2)) {
          boss.phaseBurstCooldown = 60;
          const bcx = boss.x + boss.w/2, bcy = boss.y + boss.h/2;
          const bd = DIR[boss.dir];
          for (let angle_offset of [-0.26, 0, 0.26]) {
            const cos = Math.cos(angle_offset), sin = Math.sin(angle_offset);
            const vx = (bd.x * cos - bd.y * sin) * 3;
            const vy = (bd.y * cos + bd.x * sin) * 3;
            bullets.push({
              x: bcx + bd.x*(boss.w/2) - 2,
              y: bcy + bd.y*(boss.h/2) - 2,
              vx, vy, from: 'e', w: 4, h: 4
            });
          }
          sfx.shoot();
        }
      }
    }

    // AI 队友（空投降落中不行动）
    if (ally && ally.alive && !ally.dropIn) {
      if (ally.cooldown > 0) ally.cooldown-=dt;
      ally.aiTimer-=dt;
      let target = null, minD2 = Infinity;
      for (const e of enemies) if (e.alive) {
        const dx = e.x-ally.x, dy = e.y-ally.y, d2 = dx*dx+dy*dy;
        if (d2 < minD2) { minD2 = d2; target = e; }
      }
      if (boss && boss.alive) {
        const dx = boss.x-ally.x, dy = boss.y-ally.y, d2 = dx*dx+dy*dy;
        if (d2 < minD2) { minD2 = d2; target = boss; }
      }
      if (target && ally.aiTimer <= 0) {
        if (minD2 > 180*180) ally.dir = dirTowards(ally, target);
        else if (minD2 < 70*70) ally.dir = dirSideways(ally, target);
        else ally.dir = Math.random()<0.5 ? dirSideways(ally, target) : dirTowards(ally, target);
        ally.aiTimer = 15 + ((Math.random()*20)|0);
      }
      // 前方砖墙？开火
      if (ally.cooldown <= 0 && tileAhead(ally) === 1) shoot(ally);
      const allyBefore = {x:ally.x, y:ally.y};
      moveTank(ally, dt);
      if (allyBefore.x===ally.x && allyBefore.y===ally.y && ally.aiTimer > 0) {
        // 卡住了——重定向绕开
        const ahead = tileAhead(ally);
        if (ahead === 2 || ahead === 5) { // 钢墙
          const perpDirs = ally.dir==='up'||ally.dir==='down' ? ['left','right'] : ['up','down'];
          ally.dir = target ? bestDir(perpDirs, ally, target) : perpDirs[(Math.random()*2)|0];
          ally.aiTimer = 5 + ((Math.random()*8)|0);
        } else {
          const perp = ally.dir==='up'||ally.dir==='down' ? ['left','right'] : ['up','down'];
          ally.dir = perp[(Math.random()*2)|0];
          moveTank(ally, dt);
          if (allyBefore.x===ally.x && allyBefore.y===ally.y) {
            const perpDirs = ally.dir==='up'||ally.dir==='down' ? ['left','right'] : ['up','down'];
            ally.dir = target ? bestDir(perpDirs, ally, target) : perpDirs[(Math.random()*2)|0];
            ally.aiTimer = 5 + ((Math.random()*8)|0);
          }
        }
      }
      if (target && ally.cooldown <= 0 && Math.random() < (ally.isAirdrop ? 0.4 : 0.7) && hasLineOfSight(ally.x+ally.w/2, ally.y+ally.h/2, target.x+target.w/2, target.y+target.h/2)) {
        ally.dir = dirTowards(ally, target);
        shoot(ally);
        if (ally.isAirdrop) ally.cooldown = 60;
      }
    }
    // 空投降落动画
    if (ally && ally.dropIn && ally.dropIn > 0) {
      ally.dropIn-=dt;
      if (ally.dropIn < 0) ally.dropIn = 0; // 防止 dt 过大导致负数卡死
      ally.y += (ally.targetY - ally.y + TILE) / 30 * dt;
      if (ally.dropIn <= 0) {
        ally.y = ally.targetY;
        explode(ally.x+8, ally.y-4, '#fff');
        sfx.boom();
      }
    }
    // 队友复活（Boss关队友才复活，空投不复活）
    if (ally && !ally.alive && ally.isAirdrop) {
      ally = null;
    }
    if (ally && !ally.alive && !ally.isAirdrop) {
      if (allyRespawnTimer > 0) allyRespawnTimer-=dt;
      else if (allyRespawnTimer <= 0) {
        ally.alive = true;
        ally.hp = ally.maxHp;
        ally.x = 20 * TILE; ally.y = (ROWS-3) * TILE;
      }
    }

    // 子弹
    for (const b of bullets) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x<0||b.y<0||b.x>W||b.y>H) { b.dead=true; continue; }
      const c=(b.x/TILE)|0, r=(b.y/TILE)|0;
      if (c>=0&&r>=0&&c<COLS&&r<ROWS){
        const v = map[r][c];
        if (v===1) { map[r][c]=0; b.dead=true; explode(b.x,b.y,'#caa'); continue; }
        if (v===2) { if (!(apBulletTimer>0 && b.from==='p')) b.dead=true; continue; }
        if (v===3) { // 基地
          if (baseShieldTimer > 0){ b.dead=true; explode(b.x,b.y,'#88ff44'); continue; }
          if (base.alive){
            base.hp--;
            if (base.hp <= 0){ base.alive=false; map[r][c]=0; explode(b.x,b.y,'#ffd24d'); shake(15,5); gameOver(false); }
            else { explode(b.x,b.y,'#ffa500'); sfx.hit(); }
          }
          b.dead=true; continue;
        }
      }
      // 击中坦克
      if (b.from==='p'){
        if (boss && boss.alive && rectsOverlap({x:b.x,y:b.y,w:b.w,h:b.h},boss)){
          boss.hp--;
          if (boss.hp <= 0){
            boss.alive = false;
            explode(boss.x+boss.w/2,boss.y+boss.h/2,'#ff0',true);
            hitStopTimer = 8;
            score += 500 + level * 100;
          } else {
            explode(b.x,b.y,'#ff0');
            score += 20;
          }
          b.dead=true; scoreEl.textContent=score; continue;
        }
        for (const e of enemies) if (e.alive && rectsOverlap({x:b.x,y:b.y,w:b.w,h:b.h},e)){
          e.hp--;
          if (e.hp <= 0){ enemiesKilledThisLevel++; e.alive=false; explode(e.x+e.w/2,e.y+e.h/2,e.color); score += 100; spawnDrop(e); hitStopTimer = 4;
            comboCount++; comboTimer = 180;
            if (comboCount >= 2){ score += comboCount * 10; comboDisplayTimer = 60; }
            scoreEl.textContent=score;
          }
          else { explode(b.x,b.y,'#888'); score += 20; }
          b.dead=true; scoreEl.textContent=score; break;
        }
      } else {
        if (ally && ally.alive && rectsOverlap({x:b.x,y:b.y,w:b.w,h:b.h},ally)){
          b.dead=true; explode(b.x,b.y,'#4af'); sfx.hit();
          ally.hp--;
          if (ally.hp <= 0) { ally.alive=false; allyRespawnTimer=480; }
          continue;
        }
        if (player.alive && rectsOverlap({x:b.x,y:b.y,w:b.w,h:b.h},player)){
          if (cheatInvincible || shieldTimer > 0) {
            b.dead=true; explode(b.x,b.y, cheatInvincible?'#ff0':'#4af');
            continue;
          }
          b.dead=true; sfx.hit();
          playerHP--;
          updateHPDisplay();
          if (playerHP <= 0){
            explode(player.x+player.w/2,player.y+player.h/2,player.color);
            player.alive=false;
            lives--; livesEl.textContent=lives;
            comboCount = 0; comboTimer = 0;
            if (dualMode){ if (lives<=0 && p2lives<=0) gameOver(false); }
            else if (lives<=0) gameOver(false);
            else respawnTimer = setTimeout(()=>{ if (running) spawnPlayer(); }, 800);
          } else {
            explode(b.x,b.y,'#f44');
          }
        }
        if (dualMode && player2 && player2.alive && rectsOverlap({x:b.x,y:b.y,w:b.w,h:b.h},player2)){
          b.dead=true; explode(player2.x+player2.w/2,player2.y+player2.h/2,player2.color); sfx.hit();
          player2.alive=false;
          p2lives--; p2livesEl.textContent=p2lives;
          if (p2lives<=0 && lives<=0) gameOver(false);
          else p2respawnTimer = setTimeout(()=>{
            if (!dualMode || !running) return;
            for (let r=ROWS-3;r<=ROWS-2;r++) for (let c=22;c<=23;c++) if (map[r]&&map[r][c]===1) map[r][c]=0;
            player2 = makeTank(true);
            player2.x=22*TILE; player2.y=(ROWS-3)*TILE; player2.color='#4488ff';
          }, 800);
        }
      }
    }
    bullets = bullets.filter(b=>!b.dead);

    // 子弹互相抵消（敌我子弹相遇）
    for (let i=0;i<bullets.length;i++){
      for (let j=i+1;j<bullets.length;j++){
        const a=bullets[i], b=bullets[j];
        if (a.dead||b.dead) continue;
        if (a.from!==b.from && rectsOverlap({x:a.x,y:a.y,w:a.w,h:a.h},b)){
          a.dead=b.dead=true;
          explode((a.x+b.x)/2,(a.y+b.y)/2,'#fff');
          sfx.clank();
        }
      }
    }
    bullets = bullets.filter(b=>!b.dead);
    enemies = enemies.filter(e=>e.alive);
    enemiesEl.textContent = enemies.length;

    // 生成敌人（先于过关判定，避免空场时直接判胜）
    const maxEnemies = Math.min(1 + Math.floor((level-1) * 0.6), 5);
    if (enemies.length < maxEnemies && spawnTimer<=0){
      spawnEnemy(); spawnTimer = 180 + ((Math.random()*120)|0) - level*10;
      if (spawnTimer < 60) spawnTimer = 60;
    }
    if (spawnTimer>0) spawnTimer-=dt;

    // 关卡过关判定
    if (!upgradePending && base.alive) {
      let done = false;
      if (level % 5 === 0) {
        if (boss && !boss.alive) done = true;
      } else if (endlessMode) {
        if (waveSpawned && enemies.length === 0 && spawnTimer <= 0) done = true;
      } else {
        if (enemiesKilledThisLevel >= 20 + (level-1) * 2) done = true;
      }
      if (done) {
        upgradePending = true;
        paused = true;
        sfx.level();
        showUpgradeScreen();
      }
    }

    // 道具生成
    if (pickupTimer <= 0 && pickups.length < 1){
      spawnPickup();
      pickupTimer = 480 + ((Math.random()*300)|0);
    }
    if (pickupTimer > 0) pickupTimer-=dt;

    // 空投AI队友（非Boss关，30秒一次概率触发）
    if (level % 5 !== 0){
      if (airdropTimer <= 0 && (!ally || !ally.alive)){
        if (Math.random() < 0.25){ spawnAirdrop(); }
        airdropTimer = 1200 + ((Math.random()*600)|0);
      }
      if (airdropTimer > 0) airdropTimer-=dt;
    }

    // 道具拾取文字反馈
    const PICKUP_NAMES = {
      shield: ['🛡 护盾','#44aaff'],
      bullet: ['🔥 火力强化','#ffaa00'],
      doubleshot: ['💥 双发','#ff66aa'],
      baseshield: ['🏰 基地加固','#88ff44'],
      freeze: ['❄ 冰冻','#aaddff'],
      bomb: ['💣 全屏炸弹','#ff4444'],
      apbullet: ['⚡ 穿甲弹','#ffcc00'],
      repair: ['🔧 基地维修','#44dd44'],
      medkit: ['💚 回血','#44ff44'],
    };
    function showPickupToast(type) {
      const info = PICKUP_NAMES[type];
      if (!info) return;
      const el = document.getElementById('pickupNotify');
      if (!el) return;
      el.textContent = info[0];
      el.style.color = info[1];
      el.style.display = 'block';
      el.style.opacity = '1';
      if (el._timer) clearTimeout(el._timer);
      el._timer = setTimeout(() => { el.style.opacity = '0'; setTimeout(() => { if (el.style.opacity === '0') el.style.display = 'none'; }, 300); }, 1800);
    }

    // 拾取道具（玩家1）
    if (player.alive){
      for (const p of pickups){
        if (!rectsOverlap(player,p)) continue;
        sfx.powerup();
        if (p.type === 'shield'){ shieldTimer = 300; }
        if (p.type === 'bullet'){ bulletUpgraded = true; }
        if (p.type === 'doubleshot'){ doubleShot = true; }
        if (p.type === 'baseshield'){ baseShieldTimer = 600; }
        if (p.type === 'freeze'){ freezeTimer = 180; }
        if (p.type === 'bomb'){
          for (const e of enemies) if (e.alive){ enemiesKilledThisLevel++; e.alive=false; explode(e.x+e.w/2,e.y+e.h/2,e.color); score+=100; }
          scoreEl.textContent=score;
          shake(15,4);
        }
        if (p.type === 'apbullet'){ apBulletTimer = 300; }
        if (p.type === 'repair'){
          if (base.alive){
            base.hp = Math.min(base.hp+2, base.maxHp);
          }
          const br=base.r, bc=base.c;
          for (let r=br-2;r<=br;r++) for (let c=bc-2;c<=bc+2;c++){
            if (r>=0&&c>=0&&r<ROWS&&c<COLS && map[r][c]===0 && !(r===br && c===bc)) map[r][c]=1;
          }
        }
        if (p.type === 'medkit'){
          playerHP = Math.min(playerHP + 2, playerMaxHP);
          explode(p.x,p.y,'#44ff44');
        }
        showPickupToast(p.type);
        p.dead = true;
      }
    }
    if (dualMode && player2 && player2.alive){
      for (const p of pickups){
        if (p.dead) continue;
        if (!rectsOverlap(player2,p)) continue;
        sfx.powerup();
        if (p.type === 'shield'){ shieldTimer = 300; }
        if (p.type === 'bullet'){ bulletUpgraded = true; }
        if (p.type === 'doubleshot'){ doubleShot = true; }
        if (p.type === 'baseshield'){ baseShieldTimer = 600; }
        if (p.type === 'freeze'){ freezeTimer = 180; }
        if (p.type === 'bomb'){
          for (const e of enemies) if (e.alive){ enemiesKilledThisLevel++; e.alive=false; explode(e.x+e.w/2,e.y+e.h/2,e.color); score+=100; }
          scoreEl.textContent=score;
          shake(15,4);
        }
        if (p.type === 'apbullet'){ apBulletTimer = 300; }
        showPickupToast(p.type);
        p.dead = true;
      }
    }
    pickups = pickups.filter(p=>!p.dead);

    // 护盾/基地护盾/冰冻/穿甲弹倒计时
    if (shieldTimer > 0) shieldTimer-=dt;
    if (baseShieldTimer > 0) baseShieldTimer-=dt;
    if (freezeTimer > 0) freezeTimer-=dt;
    if (apBulletTimer > 0) apBulletTimer-=dt;
    if (shakeTimer > 0) shakeTimer-=dt;
    if (comboTimer > 0) { comboTimer-=dt; if (comboTimer <= 0) comboCount = 0; }
    if (comboDisplayTimer > 0) comboDisplayTimer-=dt;
    bufShieldEl.textContent = shieldTimer > 0 ? (Math.ceil(shieldTimer/60)+'秒') : '-';
    bufBulletEl.textContent = bulletUpgraded ? '升级' : '普通';
    bufDoubleEl.textContent = doubleShot ? '二连射' : '-';
    if (base && base.alive) {
      const hp = base.hp;
      bufBaseEl.textContent = baseShieldTimer > 0 ? ('🛡'+Math.ceil(baseShieldTimer/60)+'秒') : '❤'.repeat(Math.max(0,hp));
    } else {
      bufBaseEl.textContent = '💀';
    }
    bufFreezeEl.textContent = freezeTimer > 0 ? (Math.ceil(freezeTimer/60)+'秒') : '-';
    bufApEl.textContent = apBulletTimer > 0 ? (Math.ceil(apBulletTimer/60)+'秒') : '-';
    // 武器面板
    wpnBullet.textContent = bulletUpgraded ? '🔥 强化弹' : '○ 普通弹';
    wpnBullet.className = bulletUpgraded ? 'wpn-val active' : 'wpn-val';
    wpnShield.textContent = shieldTimer > 0 ? ('🛡 ' + Math.ceil(shieldTimer/60) + 's') : '-';
    wpnShield.className = shieldTimer > 0 ? 'wpn-val active' : 'wpn-val';
    wpnDouble.textContent = doubleShot ? '💥 二连射' : '-';
    wpnDouble.className = doubleShot ? 'wpn-val active' : 'wpn-val';
    wpnAp.textContent = apBulletTimer > 0 ? ('⚡ ' + Math.ceil(apBulletTimer/60) + 's') : '-';
    wpnAp.className = apBulletTimer > 0 ? 'wpn-val active' : 'wpn-val';
    // 连杀显示
    if (comboCount >= 2 && comboDisplayTimer > 0) {
      comboRow.style.display = '';
      comboDisplay.textContent = '×' + comboCount;
    } else {
      comboRow.style.display = 'none';
    }
    updateHPDisplay();

    // 粒子
    for (const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
    particles = particles.filter(p=>p.life>0);
  }

  function dirTowards(e, t){
    if (!t || !t.alive) return DIR_LIST[(Math.random()*4)|0];
    const dx = t.x - e.x, dy = t.y - e.y;
    if (Math.abs(dx)>Math.abs(dy)) return dx>0?'right':'left';
    return dy>0?'down':'up';
  }
  function dirSideways(e, t){
    if (!t || !t.alive) return DIR_LIST[(Math.random()*4)|0];
    const dx = t.x - e.x, dy = t.y - e.y;
    if (Math.abs(dx)>Math.abs(dy)) return Math.random()<0.5?'up':'down';
    return Math.random()<0.5?'left':'right';
  }
  // 获取坦克前方1.5格的瓦片值（0=空地 1=砖 2=钢 3=基地 5=不可摧毁）
  function tileAhead(t) {
    const d = DIR[t.dir];
    const cx = t.x + t.w/2 + d.x * TILE * 1.5;
    const cy = t.y + t.h/2 + d.y * TILE * 1.5;
    const tc = Math.floor(cx / TILE), tr = Math.floor(cy / TILE);
    if (tc < 0 || tc >= COLS || tr < 0 || tr >= ROWS) return -1;
    return map[tr][tc];
  }
  // 从候选方向中选最靠近目标的方向
  function bestDir(dirs, t, target) {
    if (!target || !target.alive) return dirs[(Math.random()*2)|0];
    let best = dirs[0], bestDist = Infinity;
    for (const dir of dirs) {
      const d = DIR[dir];
      const nx = t.x + d.x * TILE, ny = t.y + d.y * TILE;
      const dx = target.x - nx, dy = target.y - ny;
      const dist = dx*dx + dy*dy;
      if (dist < bestDist) { bestDist = dist; best = dir; }
    }
    return best;
  }

  // 选前方最空旷的方向（卡死时自救）
  function bestOpenDir(t) {
    let best = 'up', bestOpen = 0;
    for (const dir of ['up','down','left','right']) {
      const d = DIR[dir];
      let open = 0;
      for (let i=1; i<=4; i++) {
        const cx = t.x + t.w/2 + d.x * TILE * i;
        const cy = t.y + t.h/2 + d.y * TILE * i;
        const tc = Math.floor(cx/TILE), tr = Math.floor(cy/TILE);
        if (tc<0||tc>=COLS||tr<0||tr>=ROWS) break;
        if (map[tr][tc]===0||map[tr][tc]===4||map[tr][tc]===6) open = i;
        else break;
      }
      if (open > bestOpen) { bestOpen = open; best = dir; }
    }
    return best;
  }

  function nextLevel(){
    enemies = []; bullets = []; pickups = []; boss = null; ally = null; allyRespawnTimer = 0; hitStopTimer = 0;
    enemiesKilledThisLevel = 0;
    shieldTimer = 0; bulletUpgraded = false; doubleShot = false; baseShieldTimer = 0; freezeTimer = 0; apBulletTimer = 0;
    p1SlideTimer = 0; p1SlideDir = null; p1SlideSpeed = 0; p2SlideTimer = 0; p2SlideDir = null; p2SlideSpeed = 0;
    comboCount = 0; comboTimer = 0; comboDisplayTimer = 0;
    spawnTimer = endlessMode ? 120 : 0; waveSpawned = false; airdropTimer = 0;
    if (level % 5 === 0){
      generateBossArena();
      spawnPlayer(false); spawnAlly();
      spawnBoss();
    } else {
      emptyMap();
      spawnPlayer(false);
      const count = Math.min(1 + (level-1), 4);
      for (let i=0;i<count;i++) spawnEnemy();
    }
  }

  // ===== 像素绘制 =====
  function px(x,y,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,1,1); }
  function fillRect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w,h); }

  function drawTank(t){
    const x=t.x, y=t.y, s=TILE;
    // 车身
    fillRect(x+2,y+2,s-4,s-4, t.color);
    fillRect(x+3,y+3,s-6,s-6, '#000');
    fillRect(x+5,y+5,s-10,s-10, t.color);
    // 炮管
    const d=t.dir;
    const cx=x+s/2, cy=y+s/2;
    if (d==='up') fillRect(cx-1,y-3,2,s+2,'#fff');
    if (d==='down') fillRect(cx-1,y+1,2,s+2,'#fff');
    if (d==='left') fillRect(x-3,y+s/2-1,s+2,2,'#fff');
    if (d==='right') fillRect(x+1,y+s/2-1,s+2,2,'#fff');
    // 履带
    fillRect(x,y,s,2,'#444'); fillRect(x,y+s-2,s,2,'#444');
  }

  function drawBoss(b) {
    const x=b.x, y=b.y, s=32;
    fillRect(x,y,s,4,'#555'); fillRect(x,y+s-4,s,4,'#555');
    fillRect(x,y,4,s,'#555'); fillRect(x+s-4,y,4,s,'#555');
    fillRect(x+4,y+4,s-8,s-8, b.color);
    fillRect(x+6,y+6,s-12,s-12, '#000');
    fillRect(x+10,y+10,s-20,s-20, b.color);
    const cx=x+s/2, cy=y+s/2;
    fillRect(cx-6,cy-2,12,4, '#fff');
    const d=b.dir;
    if (d==='up') fillRect(cx-2,cy-14,4,14,'#fff');
    else if (d==='down') fillRect(cx-2,cy,4,14,'#fff');
    else if (d==='left') fillRect(cx-14,cy-2,14,4,'#fff');
    else if (d==='right') fillRect(cx,cy-2,14,4,'#fff');
    // Phase 2 flash overlay
    if (b.phaseFlash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, b.phaseFlash/15)})`;
      ctx.fillRect(x, y, s, s);
    }
  }

  function drawTerrainTile(v, x, y) {
    if (v===1){ // 砖 — brighter contrast, destructible look
      fillRect(x,y,TILE,TILE,'#5a2010');
      // Row 1: two bricks
      fillRect(x,y,7,5,'#d44a20'); fillRect(x+8,y,8,5,'#d44a20');
      fillRect(x+1,y+1,5,3,'#e86740'); fillRect(x+9,y+1,6,3,'#e86740');
      // Row 2: staggered
      fillRect(x,y+6,4,4,'#b83818'); fillRect(x+5,y+6,6,5,'#d44a20');
      fillRect(x+12,y+6,4,4,'#b83818');
      fillRect(x+6,y+7,4,3,'#e86740');
      // Row 3
      fillRect(x,y+11,7,5,'#d44a20'); fillRect(x+8,y+11,8,5,'#d44a20');
      fillRect(x+1,y+12,5,3,'#e86740'); fillRect(x+9,y+12,6,3,'#e86740');
    } else if (v===2){ // 钢 — metallic grid with bolts
      fillRect(x,y,TILE,TILE,'#4a5060');
      fillRect(x+1,y+1,TILE-2,TILE-2,'#6a7080');
      // Cross-hatch grid
      fillRect(x,y+4,TILE,1,'#8890a0'); fillRect(x,y+11,TILE,1,'#8890a0');
      fillRect(x+4,y,1,TILE,'#8890a0'); fillRect(x+11,y,1,TILE,'#8890a0');
      // Center beam
      fillRect(x+1,y+7,TILE-2,2,'#9aa0b0');
      // Corner bolts
      fillRect(x+2,y+2,2,2,'#fff'); fillRect(x+TILE-4,y+2,2,2,'#fff');
      fillRect(x+2,y+TILE-4,2,2,'#fff'); fillRect(x+TILE-4,y+TILE-4,2,2,'#fff');
    } else if (v===3){ // 基地 — eagle/nest symbol
      const hpPct = base && base.alive ? base.hp/base.maxHp : 0;
      const baseColor = hpPct > 0.6 ? '#ffd24d' : (hpPct > 0.3 ? '#ff8800' : '#ff4444');
      const innerColor = hpPct > 0.6 ? '#a86b00' : (hpPct > 0.3 ? '#994400' : '#882222');
      fillRect(x+2,y+2,TILE-4,TILE-4, baseColor);
      fillRect(x+4,y+4,TILE-8,TILE-8, innerColor);
      fillRect(x+6,y+6,4,4, baseColor);
      if (baseShieldTimer > 0){ ctx.strokeStyle='#88ff44'; ctx.lineWidth=2; ctx.strokeRect(x,y,TILE,TILE); }
    } else if (v===5){ // 水域 — deeper blue, brighter ripples
      const t = Date.now() / 400;
      fillRect(x,y,TILE,TILE,'#0a2a4a');
      fillRect(x+1,y+1,TILE-2,TILE-2,'#1a5090');
      fillRect(x+2,y+2,TILE-4,TILE-4,'#2a70b0');
      const w1 = Math.sin(t + x*0.3 + y*0.5) * 2 + 3;
      fillRect(x+2+w1,y+3,4,2,'#50b0f0');
      const w2 = Math.sin(t + 2 + x*0.4 + y*0.3) * 2 + 8;
      fillRect(x+w2,y+7,3,2,'#50b0f0');
      const w3 = Math.sin(t + 1 + x*0.2 + y*0.6) * 2 + 5;
      fillRect(x+3+w3,y+11,4,2,'#50b0f0');
      const w4 = Math.sin(t + 3 + x*0.5 + y*0.2) * 2 + 11;
      fillRect(x+w4-2,y+5,3,2,'#50b0f0');
    } else if (v===6){ // 冰面 — clearly special terrain
      fillRect(x,y,TILE,TILE,'#608090');
      fillRect(x+1,y+1,TILE-2,TILE-2,'#709098');
      // Grid lines showing icy surface
      fillRect(x,y+5,TILE,1,'#90b8c8'); fillRect(x,y+10,TILE,1,'#90b8c8');
      fillRect(x+5,y,1,TILE,'#90b8c8'); fillRect(x+10,y,1,TILE,'#90b8c8');
      // White reflection highlights
      fillRect(x+2,y+2,3,2,'#d0eaf8');
      fillRect(x+10,y+7,4,2,'#d0eaf8');
      fillRect(x+6,y+12,3,2,'#d0eaf8');
    }
  }

  function drawPickup(p) {
    const x=p.x, y=p.y, s=TILE;
    if (p.type==='shield'){
      fillRect(x+2,y+2,s-4,s-4,'#44aaff');
      fillRect(x+4,y+4,s-8,s-8,'#88ccff');
    } else if (p.type==='bullet'){
      fillRect(x+2,y+2,s-4,s-4,'#ffaa00');
      fillRect(x+4,y+3,s-8,s-10,'#ffdd44');
      fillRect(x+7,y+5,2,6,'#fff');
    } else if (p.type==='doubleshot'){
      fillRect(x+1,y+2,s-2,s-4,'#ff66aa');
      fillRect(x+3,y+4,s-6,s-8,'#ff99cc');
      fillRect(x+5,y+5,2,4,'#fff');
      fillRect(x+9,y+5,2,4,'#fff');
    } else if (p.type==='baseshield'){
      fillRect(x+2,y+2,s-4,s-4,'#88ff44');
      fillRect(x+4,y+4,s-8,s-8,'#bbff88');
      fillRect(x+6,y+6,4,4,'#fff');
    } else if (p.type==='freeze'){
      fillRect(x+1,y+1,s-2,s-2,'#aaddff');
      fillRect(x+3,y+3,s-6,s-6,'#cceeff');
      fillRect(x+5,y+5,6,6,'#fff');
      fillRect(x+5,y+11,10,2,'#66ccff');
    } else if (p.type==='bomb'){
      fillRect(x+1,y+1,s-2,s-2,'#ff4444');
      fillRect(x+3,y+3,s-6,s-6,'#ff8888');
      fillRect(x+5,y+5,2,6,'#333');
      fillRect(x+8,y+5,2,4,'#333');
    } else if (p.type==='apbullet'){
      fillRect(x+1,y+1,s-2,s-2,'#ffcc00');
      fillRect(x+3,y+3,s-6,s-6,'#ffe066');
      fillRect(x+5,y+5,6,2,'#333');
      fillRect(x+8,y+5,2,6,'#333');
      fillRect(x+3,y+7,4,1,'#333');
    } else if (p.type==='repair'){
      fillRect(x+1,y+1,s-2,s-2,'#44dd44');
      fillRect(x+3,y+3,s-6,s-6,'#88ff88');
      fillRect(x+5,y+4,6,8,'#44dd44');
      fillRect(x+4,y+6,8,4,'#44dd44');
    } else if (p.type==='medkit'){
      fillRect(x+1,y+1,s-2,s-2,'#fff');
      fillRect(x+3,y+3,s-6,s-6,'#ff4444');
      fillRect(x+5,y+4,6,8,'#fff');
      fillRect(x+4,y+6,8,4,'#fff');
    }
  }

  function draw(){
    fillRect(0,0,W,H,'#0a0a0a');
    // Subtle floor tile grid
    ctx.fillStyle='#141414';
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){ ctx.fillRect(c*TILE,r*TILE,TILE,1); ctx.fillRect(c*TILE,r*TILE,1,TILE); }
    let _shook = false;
    if (shakeTimer>0){
      const ox=(Math.random()-0.5)*2*shakeIntensity;
      const oy=(Math.random()-0.5)*2*shakeIntensity;
      ctx.save(); ctx.translate(ox,oy); _shook=true;
    }
    // Boss 血条
    if (boss && boss.alive) {
      const bw=180, bh=10, bx=(W-bw)/2, by=3;
      fillRect(bx,by,bw,bh,'#333');
      const pct = boss.hp/boss.maxHp;
      fillRect(bx+1,by+1,(bw-2)*pct,bh-2, pct>0.5?'#ff4444':(pct>0.25?'#ff8800':'#ffcc00'));
      ctx.fillStyle='#fff'; ctx.font='7px monospace'; ctx.textAlign='center';
      ctx.fillText('BOSS '+boss.hp+'/'+boss.maxHp, bx+bw/2, by+bh-3);
    }
    // 地图层1: 非草地部分
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
      const v=map[r][c], x=c*TILE, y=r*TILE;
      if (v!==4) drawTerrainTile(v, x, y);
    }
    // 道具
    for (const p of pickups) drawPickup(p);
    // 子弹 — with glow effects
    for (const b of bullets){
      const gc = b.from==='p' ? '#22cc22' : '#ff6600';
      const bc = b.from==='p' ? '#6cff6c' : '#ff5555';
      if (apBulletTimer>0 && b.from==='p'){
        fillRect(b.x-2,b.y-2,b.w+4,b.h+4,'#aa8800');
        fillRect(b.x-1,b.y-1,b.w+2,b.h+2,'#ffcc00');
        fillRect(b.x,b.y,b.w,b.h,'#ffdd44');
      } else {
        fillRect(b.x-1,b.y-1,b.w+2,b.h+2,gc);
        fillRect(b.x,b.y,b.w,b.h,bc);
      }
    }
    // 坦克（在草地下方）
    if (player.alive) {
      drawTank(player);
      if (shieldTimer > 0){
        ctx.strokeStyle = '#44aaff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x+8, player.y+8, 10, 0, Math.PI*2);
        ctx.stroke();
      }
      if (p1SlideTimer > 0) { ctx.fillStyle='rgba(100,180,255,0.3)'; ctx.fillRect(player.x,player.y,TILE,TILE); }
    }
    if (dualMode && player2 && player2.alive) { drawTank(player2); if (p2SlideTimer > 0) { ctx.fillStyle='rgba(100,180,255,0.3)'; ctx.fillRect(player2.x,player2.y,TILE,TILE); } }
    if (ally && ally.alive) {
      if (ally.dropIn && ally.dropIn > 0) {
        const ax = ally.x + 8, ay = ally.y;
        ctx.fillStyle = '#f8f8f8';
        ctx.beginPath();
        ctx.moveTo(ax, ay-16); ctx.lineTo(ax-10, ay-4); ctx.lineTo(ax+10, ay-4); ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(ax, ay-16); ctx.lineTo(ax, ay); ctx.stroke();
        drawTank(ally);
      } else {
        drawTank(ally);
      }
    }
    for (const e of enemies) if (e.alive) drawTank(e);
    if (boss && boss.alive) drawBoss(boss);
    // 冰冻视觉效果
    if (freezeTimer > 0){
      for (const e of enemies) if (e.alive){
        ctx.fillStyle = 'rgba(100,200,255,0.35)';
        ctx.fillRect(e.x,e.y,TILE,TILE);
      }
    }
    // 地图层2: 草地覆盖坦克
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
      if (map[r][c]===4){
        const x=c*TILE, y=r*TILE;
        fillRect(x,y,TILE,TILE,'#1a3a10');
        // Fewer, larger grass clusters
        fillRect(x+1,y+2,5,6,'#3a7a20');
        fillRect(x+8,y+1,5,7,'#4a8a28');
        fillRect(x+3,y+9,6,5,'#3a7a20');
        fillRect(x+10,y+8,4,6,'#4a8a28');
        fillRect(x+1,y+11,3,3,'#5a9a30');
      }
    }
    // 粒子
    for (const p of particles) fillRect(p.x,p.y,p.size||2,p.size||2,p.color);
    // 连杀提示
    if (comboDisplayTimer > 0 && comboCount >= 2){
      const opacity = Math.min(1, comboDisplayTimer / 20);
      ctx.fillStyle = 'rgba(255,255,255,' + opacity + ')';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'right';
      ctx.fillText('x' + comboCount + ' COMBO!', W-10, 25);
    }
    // 关卡主题色
    if (level >= 4){
      let theme = '';
      if (level <= 6) theme = 'rgba(180,200,255,0.05)';
      else if (level <= 9) theme = 'rgba(255,180,180,0.05)';
      else theme = 'rgba(200,180,255,0.06)';
      if (theme) fillRect(0,0,W,H,theme);
    }
    if (_shook) ctx.restore();
  }

  function loop(time){
    const dt = lastTime ? Math.min((time - lastTime) / 16.667, 3) : 1;
    lastTime = time;
    if (!map.length) { emptyMap(); spawnPlayer(); enemies=[]; bullets=[]; particles=[]; pickups=[]; }
    update(dt); draw(); requestAnimationFrame(loop);
  }

  function startGame(mode){
    lastTime = 0; clearTimeout(respawnTimer); clearTimeout(p2respawnTimer); shakeTimer = 0; hitStopTimer = 0;
    dualMode = (mode==='dual');
    endlessMode = (mode==='endless');
    document.body.classList.add('running');
    bgmStop();
    score=0; level=1; lives=3; p2lives=3; running=true; paused=false;
    enemiesKilledThisLevel=0;
    bullets=[]; particles=[]; enemies=[]; spawnTimer=0; pickups=[]; boss=null; ally=null; allyRespawnTimer=0;
    shieldTimer=0; bulletUpgraded=false; doubleShot=false; baseShieldTimer=0; freezeTimer=0; pickupTimer=0;
    p1SlideTimer=0; p1SlideDir=null; p1SlideSpeed=0; p2SlideTimer=0; p2SlideDir=null; p2SlideSpeed=0;
    comboCount=0; comboTimer=0; comboDisplayTimer=0;
    permHP=0; permLives=0; permSpeed=0; upgradePending=false;
    playerHP=5; playerMaxHP=5; waveSpawned=false; airdropTimer=0;
    document.getElementById('levelLabel').textContent = endlessMode ? '波次' : '关卡';
    emptyMap(); spawnPlayer();
    spawnTimer = endlessMode ? 120 : 0;
    scoreEl.textContent=score; levelEl.textContent=level; livesEl.textContent=lives;
    p2livesEl.textContent=p2lives;
    p2lifeRow.style.display = dualMode ? 'flex' : 'none';
    document.getElementById('btnResume').style.display = 'none';
    overlay.classList.add('hidden');
    bgmPlay();
  }

  const btnEndless = document.getElementById('btnEndless');
  btn1p.addEventListener('click', ()=>startGame('single'));
  btn2p.addEventListener('click', ()=>startGame('dual'));
  btnEndless.addEventListener('click', ()=>startGame('endless'));

  function gameOver(win){
    lastTime = 0; running=false; document.body.classList.remove('running'); bgmStop(); shakeTimer = 0;
    comboCount=0; comboTimer=0; comboDisplayTimer=0;
    ovTitle.textContent = win ? '胜利！' : '游戏结束';
    const modeLabel = endlessMode ? '波次' : '关卡';
    let extra = '';
    if (dualMode) extra = '<br>P1生命：'+lives+' &nbsp; P2生命：'+p2lives;
    ovText.innerHTML = '最终得分：<b style="color:#ffd24d">'+score+'</b><br>到达'+modeLabel+'：'+level+extra;
    btnRetry.style.display = '';
    document.getElementById('btnResume').style.display = 'none';
    overlay.classList.remove('hidden');
  }

  function backToMenu(){
    lastTime = 0; clearTimeout(respawnTimer); clearTimeout(p2respawnTimer);
    running = false; bgmStop(); shakeTimer = 0;
    document.body.classList.remove('running');
    ovTitle.textContent = '坦克大战';
    ovText.innerHTML = '<span class="pc-only">操作说明：<br>W A S D 移动 &nbsp; J / 空格 开炮<br>↑ ↓ ← → 移动 &nbsp; K 开炮（双人）<br></span>P 暂停 &nbsp; M 菜单 &nbsp; R 重试本关<br>消灭所有敌方坦克，守住基地！<br><br>生存模式无限波次，看你能撑多久！';
    btnRetry.style.display = 'none';
    document.getElementById('btnResume').style.display = '';
    overlay.classList.remove('hidden');
  }

  document.getElementById('btnResume').addEventListener('click', ()=>{
    lastTime = 0;
    document.getElementById('btnResume').style.display = 'none';
    btnRetry.style.display = 'none';
    overlay.classList.add('hidden');
    running = true;
    document.body.classList.add('running');
    bgmPlay();
  });

  btnRetry.addEventListener('click', ()=>{
    btnRetry.style.display = 'none';
    reloadLevel();
  });

  function reloadLevel(){
    lastTime = 0; clearTimeout(respawnTimer); clearTimeout(p2respawnTimer); shakeTimer = 0; hitStopTimer = 0;
    running = true;
    enemies = []; bullets = []; pickups = []; boss = null; ally = null; allyRespawnTimer = 0;
    spawnTimer = endlessMode ? 120 : 0; pickupTimer = 0; airdropTimer = 0;
    if (level % 5 === 0){
      generateBossArena();
      spawnPlayer(); spawnAlly();
      spawnBoss();
    } else {
      emptyMap();
      spawnPlayer();
    }
    overlay.classList.add('hidden');
    document.getElementById('upgradeOverlay').classList.add('hidden');
    paused = false;
  }

  function showUpgradeScreen(){
    const overlay = document.getElementById('upgradeOverlay');
    const opts = document.getElementById('upgradeOptions');
    const upgrades = [
      {id:'hp', label:'❤ 加一血', desc:'最大血量 +1（当前 '+playerHP+'/'+playerMaxHP+'）', fn:()=>{ permHP++; playerMaxHP++; playerHP++; }},
      {id:'life', label:'✚ 加一条命', desc:'额外一次复活机会', fn:()=>{ permLives++; lives++; livesEl.textContent=lives; }},
      {id:'speed', label:'⚡ 加速', desc:'移动速度 +15%', fn:()=>{ permSpeed++; }},
    ];
    if (playerHP < playerMaxHP) {
      upgrades.push({id:'heal', label:'❤️‍🩹 回血', desc:'血量回满（'+playerHP+'→'+playerMaxHP+'）', fn:()=>{ playerHP = playerMaxHP; }});
    }
    opts.innerHTML = '';
    for (const u of upgrades){
      const b = document.createElement('button');
      b.className = 'btn';
      b.style.margin = '0';
      b.innerHTML = u.label + '<br><small style="font-weight:normal;color:#666;font-size:11px">'+u.desc+'</small>';
      b.addEventListener('click', ()=>{
        u.fn();
        overlay.classList.add('hidden');
        upgradePending = false;
        level++; levelEl.textContent=level;
        paused = false;
        nextLevel(); bgmPlay();
      });
      opts.appendChild(b);
    }
    overlay.classList.remove('hidden');
  }

  window.addEventListener('keydown', e=>{
    const k = e.key;
    if (k==='w'||k==='a'||k==='s'||k==='d') keys[k]=true;
    if (k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'){ keys[k]=true; e.preventDefault(); }
    if (k==='j'||k===' '){ keys['j']=true; keys[' ']=true; e.preventDefault(); }
    if (k==='k'||k==='K'){ keys['k']=true; e.preventDefault(); }
    if ((k==='p'||k==='P') && !upgradePending){ paused=!paused; if (paused) bgmStop(); else bgmPlay(); }
    if ((k==='r'||k==='R') && running && !upgradePending){ reloadLevel(); }
    // 作弊键（仅 running 时有效）
    if (k==='o'||k==='O'){
      cheatInvincible=!cheatInvincible;
      document.getElementById('cheatRow').style.display = cheatInvincible ? 'flex' : 'none';
    }
    if ((k==='i'||k==='I') && running){
      for (const e of enemies) if (e.alive){ e.alive=false; explode(e.x+e.w/2,e.y+e.h/2,e.color); score+=100; }
      if (boss && boss.alive){ boss.alive=false; score+=500+level*100; sfx.boom(); shake(10,4); }
      scoreEl.textContent=score;
    }
    if ((k==='l'||k==='L') && running && !upgradePending && base.alive){
      upgradePending=true; paused=true; sfx.level(); showUpgradeScreen();
    }
    if ((k==='m'||k==='M') && running && !upgradePending){
      backToMenu();
    }
  });
  window.addEventListener('keyup', e=>{
    const k = e.key;
    if (k==='w'||k==='a'||k==='s'||k==='d') keys[k]=false;
    if (k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight') keys[k]=false;
    if (k==='j'||k===' '){ keys['j']=false; keys[' ']=false; }
    if (k==='k'||k==='K') keys['k']=false;
  });

  function resizeGame(){
    const g = document.getElementById('game');
    const cv = document.getElementById('screen');
    const isTouch = document.body.classList.contains('is-touch');
    if (isTouch) {
      // Touch: set canvas CSS size directly (no transform overflow issues)
      g.style.transform = 'none';
      cv.style.transform = 'none';
      const s = Math.min(window.innerWidth / cv.width, 1.5);
      cv.style.width = Math.round(cv.width * s) + 'px';
      cv.style.height = Math.round(cv.height * s) + 'px';
    } else {
      // Desktop: scale #game to fit viewport
      cv.style.width = '';
      cv.style.height = '';
      cv.style.transform = 'none';
      g.style.transform = 'none';
      const w = g.offsetWidth, h = g.offsetHeight;
      if (w === 0 || h === 0) return;
      const availW = window.innerWidth - 32;
      const availH = window.innerHeight - 32;
      const s = Math.min(availW / w, availH / h, 1.5);
      g.style.transformOrigin = 'center center';
      g.style.transform = 'scale('+s+')';
    }
  }
  window.addEventListener('resize', resizeGame);
  resizeGame();

  // 移动端 / 触屏适配
  function setupTouch(){
    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (!isTouch) return;
    document.body.classList.add('is-touch');
    // 阻止页面滚动/缩放
    document.addEventListener('touchmove', e=>{ if (e.target.closest('#game,#touch-controls')) e.preventDefault(); }, {passive:false});

    // Invisible touch movement — slide left side of screen
    let flTouchId = null;
    let flCenterX = 0, flCenterY = 0;
    const flMaxDist = 55;
    const flDeadZone = 15;

    function setMoveKeys(dx, dy) {
      keys['w'] = dy < -flDeadZone;
      keys['s'] = dy > flDeadZone;
      keys['a'] = dx < -flDeadZone;
      keys['d'] = dx > flDeadZone;
    }

    function updateMove(touch) {
      let dx = touch.clientX - flCenterX;
      let dy = touch.clientY - flCenterY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > flMaxDist) {
        const ratio = flMaxDist / dist;
        dx *= ratio;
        dy *= ratio;
      }
      setMoveKeys(dx, dy);
    }

    function stopMove() {
      flTouchId = null;
      setMoveKeys(0, 0);
    }

    document.addEventListener('touchstart', e => {
      for (const t of e.changedTouches) {
        if (t.clientX > window.innerWidth * 0.62) continue;
        if (t.target.closest('#touch-controls,#overlay,#upgradeOverlay')) continue;
        if (flTouchId === null) {
          flTouchId = t.identifier;
          flCenterX = t.clientX;
          flCenterY = t.clientY;
        }
      }
    }, {passive: false});

    document.addEventListener('touchmove', e => {
      for (const t of e.changedTouches) {
        if (t.identifier === flTouchId) { updateMove(t); e.preventDefault(); }
      }
    }, {passive: false});

    document.addEventListener('touchend', e => {
      for (const t of e.changedTouches) {
        if (t.identifier === flTouchId) stopMove();
      }
    }, {passive: false});

    document.addEventListener('touchcancel', e => {
      stopMove();
    }, {passive: false});

    // Fire button
    const fireEl = document.getElementById('btnFire');
    fireEl.addEventListener('touchstart', e => { e.preventDefault(); keys['j'] = true; fireEl.classList.add('active'); }, {passive: false});
    fireEl.addEventListener('touchend', e => { e.preventDefault(); keys['j'] = false; fireEl.classList.remove('active'); }, {passive: false});
    fireEl.addEventListener('touchcancel', e => { keys['j'] = false; fireEl.classList.remove('active'); }, {passive: false});

    // Pause and Menu
    document.getElementById('btnPause').addEventListener('touchstart', e=>{
      e.preventDefault(); if (!running) return;
      paused = !paused; if (paused) bgmStop(); else bgmPlay();
    }, {passive:false});
    document.getElementById('btnMenu').addEventListener('touchstart', e=>{
      e.preventDefault(); if (!running) return;
      backToMenu();
    }, {passive:false});
  }
  setupTouch();

  document.getElementById('muteBox').addEventListener('click', ()=>{
    muted = !muted;
    document.getElementById('muteLabel').textContent = muted ? '🔇 关闭' : '🔊 开启';
    if (muted) bgmStop(); else bgmPlay();
  });

  loop();

  // Test hooks for Playwright E2E tests
  window.__test = {
    get playerHP() { return playerHP; },
    set playerHP(v) { playerHP = Math.max(0, Math.min(v, playerMaxHP)); updateHPDisplay(); },
    get lives() { return lives; },
    set lives(v) { lives = v; livesEl.textContent = v; },
    get base() { return base ? { hp: base.hp, alive: base.alive, r: base.r, c: base.c, maxHp: base.maxHp } : null; },
    setBaseHp(v) { if (base) { base.hp = Math.max(0, v); if (base.hp <= 0) { base.alive = false; map[base.r][base.c] = 0; gameOver(false); } } },
    triggerGameOver() { if (running) gameOver(false); },
    triggerPlayerDeath() {
      if (!running || !player || !player.alive) return false;
      if (cheatInvincible || shieldTimer > 0) return false;
      playerHP = 0; updateHPDisplay();
      explode(player.x+player.w/2,player.y+player.h/2,player.color);
      player.alive = false; lives--; livesEl.textContent = lives;
      if (dualMode){ if (lives<=0 && p2lives<=0) gameOver(false); }
      else if (lives<=0) gameOver(false);
      else respawnTimer = setTimeout(()=>{ if (running) spawnPlayer(); }, 800);
      return true;
    },
    get pickupsLength() { return pickups.length; },
    get bossAlive() { return boss !== null && boss.alive; },
    get isRunning() { return running; },
  };
})();
</script>
</body>
